[project]
name = "ckv"
version = "0.1.0"
description = "Experiment harness for the callosal-kv benchmark"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "plotnine>=0.14",
]

[project.scripts]
ckv = "ckv.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "mypy>=1.11",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ckv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Start strict; relax only when we have a reason.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL", "RUF"]
ignore = [
  "PLR0913",  # too many arguments — experiment harness config takes many
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to use literal expected values inline.
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# plotnine ships no type stubs; pandas stubs are third-party and noisy.
# We keep strict mode on for our own code but don't let missing 3rd-party
# annotations block the build.
[[tool.mypy.overrides]]
module = ["plotnine", "plotnine.*", "pandas", "pandas.*"]
ignore_missing_imports = true
follow_imports = "skip"

# plot.py is almost entirely plotnine builder calls whose functions are
# untyped upstream. Exempt it from the untyped-call checks.
[[tool.mypy.overrides]]
module = ["ckv.plot"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
